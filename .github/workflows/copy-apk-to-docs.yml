name: Build debug APK and copy to docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Android SDK packages (install platforms / build-tools)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "cmdline-tools;latest" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ] && [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest-2" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/latest-2" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-33" ] || [ ! -d "$ANDROID_SDK_ROOT/build-tools/33.0.2" ]; then
            echo "Required Android SDK packages not installed"
            ls -la "$ANDROID_SDK_ROOT"
            exit 1
          fi

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties','**/build.gradle*') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK (unsigned)
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to docs and push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          mkdir -p docs
          cp "$APK_PATH" docs/app-debug.apk
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add docs/app-debug.apk
          git commit -m "chore: update app-debug.apk from CI" || echo "No changes to commit"
          git push
